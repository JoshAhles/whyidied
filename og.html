<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card source — screenshot at 1200×630 to og.png</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0B0E14;color:#F2F4F8;overflow:hidden;
  font-family:'Archivo',sans-serif;font-stretch:125%;text-transform:uppercase;position:relative}
body::before{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 75% 60% at 50% 0%,rgba(255,59,78,.14),transparent 65%),
             radial-gradient(ellipse 55% 45% at 85% 110%,rgba(61,255,136,.08),transparent 60%)}
.card{position:relative;padding:64px 90px;height:100%;display:flex;flex-direction:column;justify-content:flex-start}
.elim{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.26em;color:#FF3B4E;
  font-size:24px;text-transform:uppercase;margin-bottom:26px;text-shadow:0 0 30px rgba(255,59,78,.4)}
h1{font-weight:900;font-size:56px;line-height:1.04;letter-spacing:.01em;max-width:26ch}
h1 .g{color:#3DFF88}
.verdict{margin-top:34px;border-left:4px solid #FF3B4E;padding:14px 24px;max-width:1000px;
  background:linear-gradient(90deg,rgba(255,59,78,.12),transparent 75%);border-radius:0 14px 14px 0;
  font-family:'JetBrains Mono',monospace;font-size:23px;color:#F2F4F8}
.brand{position:absolute;bottom:56px;left:90px;font-size:34px;font-weight:900}
.brand .q{color:#FF3B4E}
.url{position:absolute;bottom:56px;right:90px;font-family:'JetBrains Mono',monospace;font-size:22px;color:#8A93A6}
</style>
</head>
<body>
<div class="card">
  <div class="elim">■ Eliminated — again</div>
  <h1>Why do you keep dying in Fortnite? <span class="g">Now you'll know.</span></h1>
  <div class="verdict">AI verdict: you peeked without a wall. Third time this week.</div>
  <div class="brand">WHY<i style="font-style:normal;text-transform:none">i</i>DIED<span class="q">?</span></div>
  <div class="url">whyidied.com</div>
</div>
</body>
</html>
